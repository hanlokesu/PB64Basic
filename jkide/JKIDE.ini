[Compilers]
; JK-IDE Compilers menu configuration.
; Paths are machine specific. Edit this file, then restart JK-IDE.
JkIdeDir=C:\PBWin10\JK-IDE
PbwinExe=C:\PBWin10\bin\PBWin.exe
PbwinCwd=C:\PBWin10\bin
PbwinInc=C:\PBWin10\WINAPI
Pb64Exe=C:\path\to\PB64Basic.exe
Pb64Cwd=C:\path\to\unpacked\folder
Pb64Runtime=pb_runtime_x64.obj
Pbxb64Exe=C:\path\to\PBXB64.exe
Pbxb64Cwd=C:\path\to\PBX-Editor
; PbHelpFile: full path of the PBWin 10 help opened by "Open PB Help".
; Pb64HelpFile: full path of the PB64Basic help opened by "PB64BASIC.CHM".
; Always point these at .CHM files, never .CHW. Keep the matching .chw in the
; same folder; hh.exe loads the merged index from that folder by itself.
PbHelpFile=C:\PBWin10\JK-IDE\PBWin.chm
Pb64HelpFile=C:\PBWin10\JK-IDE\PB64Basic.chm
